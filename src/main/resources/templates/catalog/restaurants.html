<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Restaurants in Kolhapur | Zaika</title></head>
<body>
<!--/* The restaurant listing. Model: filter (catalog.RestaurantFilter), page (Page<RestaurantCard>), cuisines, sorts.
     Without JavaScript the form is a plain GET form (the Apply button sits in <noscript>). With htmx every change
     reloads only #restaurant-results; the server answers with the htmx-results fragment at the bottom. */-->
<main id="main" class="listing-page">
	<div class="container">
		<header class="listing-head">
			<p class="eyebrow">Delivering in Kolhapur</p>
			<h1>Restaurants near you</h1>
			<p class="listing-lede">Misal at dawn, biryani past midnight. Narrow it down by cuisine, rating or what's open right now.</p>
		</header>

		<form class="listing-filters" role="search" aria-label="Find restaurants" th:object="${filter}"
			th:action="@{/restaurants}" action="/restaurants" method="get"
			th:hx-get="@{/restaurants}" hx-target="#restaurant-results" hx-swap="outerHTML" hx-push-url="true"
			hx-trigger="submit, change, input changed delay:400ms from:#restaurant-q" hx-sync="this:replace"
			hx-indicator="#restaurant-results">
			<div class="listing-search">
				<label class="visually-hidden" for="restaurant-q">Search restaurants or dishes</label>
				<div class="input-group">
					<svg th:replace="~{fragments/icon :: icon('search')}"></svg>
					<input class="input" id="restaurant-q" name="q" type="search" maxlength="80" autocomplete="off"
						placeholder="Search a restaurant or a dish, like misal" th:value="*{q}">
				</div>
			</div>

			<fieldset class="filter-set">
				<legend class="visually-hidden">Cuisine</legend>
				<div class="filter-scroll">
					<label class="chip filter-chip"><input type="radio" name="cuisine" value="" th:checked="*{cuisine == null}"><span>All cuisines</span></label>
					<label th:each="c : ${cuisines}" class="chip filter-chip"><input type="radio" name="cuisine" th:value="${c.slug}" value="biryani"
						th:checked="${filter.cuisine == c.slug}"><span th:text="${c.name}">Biryani</span></label>
				</div>
			</fieldset>

			<div class="listing-toolbar">
				<fieldset class="filter-set">
					<legend class="visually-hidden">Show only</legend>
					<div class="chip-row">
						<label class="chip filter-chip"><input type="checkbox" name="veg" value="true" th:checked="*{veg}"><svg th:replace="~{fragments/icon :: icon('leaf')}"></svg><span>Pure veg</span></label>
						<label class="chip filter-chip"><input type="checkbox" name="top" value="true" th:checked="*{top}"><svg th:replace="~{fragments/icon :: icon('star')}"></svg><span>Rating 4.0+</span></label>
						<label class="chip filter-chip"><input type="checkbox" name="open" value="true" th:checked="*{open}"><svg th:replace="~{fragments/icon :: icon('clock')}"></svg><span>Open now</span></label>
					</div>
				</fieldset>
				<div class="listing-sort">
					<label class="listing-sort-label" for="restaurant-sort">Sort by</label>
					<div class="select-wrap">
						<select class="select" id="restaurant-sort" name="sort">
							<option th:each="s : ${sorts}" th:value="${s.param}" th:text="${s.label}" th:selected="${filter.sortOption == s}" value="relevance">Relevance</option>
						</select>
					</div>
				</div>
			</div>

			<noscript><div class="listing-apply"><button type="submit" class="btn btn-primary">Show restaurants</button></div></noscript>
		</form>

		<p id="listing-status" class="visually-hidden" role="status"></p>

		<section th:fragment="results" id="restaurant-results" class="listing-results" aria-labelledby="listing-count">
			<div class="listing-summary">
				<h2 id="listing-count" class="listing-count"><th:block th:replace="~{::count-text}">12 restaurants</th:block></h2>
				<a th:if="${filter.filtered and page.hasContent()}" class="btn btn-ghost btn-sm"
					th:href="@{/restaurants}" href="/restaurants"><svg th:replace="~{fragments/icon :: icon('x')}"></svg>Clear filters</a>
			</div>

			<div th:if="${page.hasContent()}" class="restaurant-grid">
				<th:block th:each="r : ${page.content}"><article th:replace="~{fragments/restaurant-card :: card(${r})}"></article></th:block>
			</div>

			<div th:unless="${page.hasContent()}">
				<th:block th:if="${filter.q != null}"><div th:replace="~{fragments/ui :: emptyState('search', |Nothing matches “${filter.q}”|,
					'Check the spelling, or try a dish like thali, misal or biryani.', 'Clear search and filters', '/restaurants')}"></div></th:block>
				<th:block th:if="${filter.q == null and filter.filtered}"><div th:replace="~{fragments/ui :: emptyState('filter', 'No restaurants match these filters',
					'Try another cuisine, or turn off Open now to see kitchens that open later.', 'Clear filters', '/restaurants')}"></div></th:block>
				<th:block th:unless="${filter.filtered}"><div th:replace="~{fragments/ui :: emptyState('store', 'No kitchens are live yet',
					'New restaurants are joining Zaika. Check back soon.', null, null)}"></div></th:block>
			</div>

			<!--/* Only the pager is boosted: a page change swaps the results and keeps the form as it is. */-->
			<div th:if="${page.totalPages > 1}" class="listing-pager" hx-boost="true" hx-target="#restaurant-results" hx-swap="outerHTML">
				<nav th:replace="~{fragments/pagination :: pagination(${page})}"></nav>
			</div>
		</section>
	</div>
</main>

<!--/* Result count text, shared by the visible heading and the screen-reader announcement. */-->
<th:block th:fragment="count-text" th:with="n=${page.totalElements}"><th:block th:text="|${n} ${n == 1 ? 'restaurant' : 'restaurants'}|">12 restaurants</th:block><th:block th:if="${filter.q != null}" th:text="| for “${filter.q}”|"></th:block></th:block>

<!--/* What htmx requests get: the new results, plus the count announced through the live region (innerHTML keeps
     the #listing-status node, so screen readers notice the change). */-->
<th:block th:fragment="htmx-results">
	<section th:replace="~{::results}"></section>
	<p id="listing-status" hx-swap-oob="innerHTML"><th:block th:replace="~{::count-text}">12 restaurants</th:block></p>
</th:block>
</body>
</html>
