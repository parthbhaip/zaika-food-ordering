<!DOCTYPE html>
<html th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}" xmlns:th="http://www.thymeleaf.org">
<head><title>Choose a new password | Zaika</title></head>
<body>
<!--/* Bound to PasswordResetForm as "form" (token in a hidden field). "linkExpired" = true when the link is unknown,
     used or older than 30 minutes; then no form is shown. Success redirects to /login with a toast. */-->
<main id="main" class="auth-page">
	<div class="container auth-layout">
		<section class="auth-card" aria-labelledby="auth-title">
			<th:block th:if="${linkExpired}">
				<header class="auth-head">
					<h1 id="auth-title">This link has expired</h1>
					<p class="auth-lede">Reset links work once and only for 30 minutes. Ask for a fresh one and open it straight away.</p>
				</header>
				<a class="btn btn-primary btn-lg btn-block" th:href="@{/forgot-password}" href="/forgot-password">Send a new link</a>
				<p class="auth-switch">Remembered your password? <a th:href="@{/login}" href="/login">Sign in</a></p>
			</th:block>

			<th:block th:unless="${linkExpired}">
				<header class="auth-head">
					<h1 id="auth-title">Choose a new password</h1>
					<p class="auth-lede">You'll use it the next time you sign in. Devices that kept you signed in will ask for it too.</p>
				</header>
				<form class="auth-form" th:action="@{/reset-password}" action="/reset-password" method="post" th:object="${form}" novalidate>
					<input type="hidden" th:field="*{token}">
					<div th:replace="~{fragments/form :: password('password', 'New password', 'At least 8 characters, with a letter and a digit.', 'new-password')}"></div>
					<div th:replace="~{fragments/form :: password('confirmPassword', 'Confirm new password', null, 'new-password')}"></div>
					<button type="submit" class="btn btn-primary btn-lg btn-block">Update password</button>
				</form>
			</th:block>
		</section>

		<aside th:replace="~{auth/forgot-password :: safety}"></aside>
	</div>
</main>
</body>
</html>
