<!DOCTYPE html>
<!--/* The site layout. A page uses it from its <html> tag and hands over its <title> and its content (normally
     its <main id="main">, which the skip link targets):
       <html th:replace="~{layouts/base :: layout(~{::title}, ~{::main})}">
     Header and footer read: cartCount (header cart badge, default 0), cartSummary and hideCartBar (phone cart bar,
     fragments/cart-bar) and the flash attributes listed in fragments/flash. No inline scripts or on* handlers anywhere (CSP script-src 'self'). */-->
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:fragment="layout(title, content)">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title th:replace="${title}">Zaika</title>
	<meta name="description" content="Order from Kolhapur's favourite kitchens: misal, tambda rassa, biryani, thalis and more, delivered hot to your door.">
	<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
	<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
	<link rel="icon" type="image/svg+xml" th:href="@{/img/favicon.svg}" href="/img/favicon.svg">
	<link rel="preload" as="font" type="font/woff2" crossorigin th:href="@{/fonts/plus-jakarta-sans-latin-400-normal.woff2}" href="/fonts/plus-jakarta-sans-latin-400-normal.woff2">
	<link rel="preload" as="font" type="font/woff2" crossorigin th:href="@{/fonts/plus-jakarta-sans-latin-700-normal.woff2}" href="/fonts/plus-jakarta-sans-latin-700-normal.woff2">
	<link rel="stylesheet" th:href="@{/css/tokens.css}" href="/css/tokens.css">
	<link rel="stylesheet" th:href="@{/css/app.css}" href="/css/app.css">
	<script defer th:src="@{/webjars/htmx.org/dist/htmx.min.js}" src="/webjars/htmx.org/dist/htmx.min.js"></script>
	<script defer th:src="@{/js/htmx-config.js}" src="/js/htmx-config.js"></script>
	<script defer th:src="@{/js/menus.js}" src="/js/menus.js"></script>
	<script defer th:src="@{/js/password-toggle.js}" src="/js/password-toggle.js"></script>
	<script defer th:src="@{/js/image-preview.js}" src="/js/image-preview.js"></script>
	<script defer th:src="@{/js/print.js}" src="/js/print.js"></script>
	<script defer th:src="@{/js/search-suggest.js}" src="/js/search-suggest.js"></script>
</head>
<body class="site">
	<a class="skip-link" href="#main">Skip to content</a>

	<header th:replace="~{fragments/header :: header}"></header>

	<main id="main" th:replace="${content}"></main>

	<div th:replace="~{fragments/cart-bar :: slot(false)}"></div>

	<div th:replace="~{fragments/flash :: toasts}"></div>

	<footer th:replace="~{fragments/footer :: footer}"></footer>
</body>
</html>
