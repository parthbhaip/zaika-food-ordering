# Automated tests: throwaway in-memory H2 in MySQL mode. Kept alive for the whole JVM so cached contexts share it.
spring.datasource.url=jdbc:h2:mem:zaika;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
# @DataJpaTest must use the datasource above (MySQL mode + Flyway), not a generated embedded one
spring.test.database.replace=none

app.mail.log-only=true
app.seed-demo=false
# Uploads written by tests stay inside the build output
app.upload-dir=./target/test-uploads
