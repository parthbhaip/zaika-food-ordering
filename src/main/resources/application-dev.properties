# Local development: H2 file database under ./data (git-ignored), MySQL compatibility mode.
spring.datasource.url=jdbc:h2:file:./data/zaika;MODE=MySQL;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=

# H2 web console at /h2-console (dev only)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Emails are written to the log instead of being sent (com.zaika.notification.LoggingMailService)
app.mail.log-only=true

# Admin account created on startup when none exists (com.zaika.user.AdminBootstrap); override with env vars
app.admin.email=${ADMIN_EMAIL:admin@zaika.test}
app.admin.password=${ADMIN_PASSWORD:Demo@1234}

# Load the demo restaurants, menus and accounts on startup
app.seed-demo=true
