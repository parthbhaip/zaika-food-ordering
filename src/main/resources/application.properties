# Shared settings for every profile. Profile files only override what differs.
spring.application.name=Zaika
spring.profiles.default=dev

# Persistence: Flyway owns the schema, Hibernate only validates it. No lazy loading during view rendering.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Web
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/xml,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB
spring.web.error.whitelabel.enabled=false
spring.web.error.include-stacktrace=never
# Page numbers in URLs start at 1 (?page=2 is the second page), matching fragments/pagination
spring.data.web.pageable.one-indexed-parameters=true

# H2 console is off everywhere (devtools would otherwise switch it on); only the dev profile enables it
spring.h2.console.enabled=false

# Zaika business settings (bound to com.zaika.config.AppProperties). Money in INR.
app.brand-name=Zaika
app.zone=Asia/Kolkata
app.upload-dir=./uploads
# Images over 2 MB are refused by StorageService with a friendly message; the container limit sits above it so that
# check is the one people see (the container's own 1 MB default would reject valid images)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
# Bigger uploads are turned into an error toast by common.UploadLimitFilter. Tomcat must read (and drop) the rest of
# such a body, or the browser sees a reset connection instead of that redirect (its default stops at 2 MB).
server.tomcat.max-swallow-size=50MB
app.seed-demo=false
app.platform-fee=5.00
app.gst-rate=0.05
app.free-delivery-threshold=499.00
app.rider-base-payout=30.00
# Riders also earn this part of the order's delivery fee (a fraction: 0.80 = 80%); free-delivery orders pay the base only
app.rider-delivery-fee-share=0.80
# Public address of the site, used for links in emails (never taken from the request's Host header)
app.base-url=http://localhost:8080
# Sender of outgoing email (SMTP only; dev and test just log mail)
app.mail.from=Zaika <no-reply@zaika.test>
# Unpaid online orders are cancelled 15 minutes after checkout; this cron (sec min hour day month weekday) says how
# often PaymentService looks for them. "-" switches the job off (the test profile does; tests call it directly).
app.payments.expiry-cron=0 * * * * *
