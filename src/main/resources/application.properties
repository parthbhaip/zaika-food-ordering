# Shared settings for every profile. Profile files only override what differs.
spring.application.name=Zaika
spring.profiles.default=dev

# Persistence: Flyway owns the schema, Hibernate only validates it. No lazy loading during view rendering.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Web
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,text/plain,text/xml,application/javascript,application/json,image/svg+xml
server.compression.min-response-size=1KB
spring.web.error.whitelabel.enabled=false
spring.web.error.include-stacktrace=never

# H2 console is off everywhere (devtools would otherwise switch it on); only the dev profile enables it
spring.h2.console.enabled=false

# Zaika business settings (bound to com.zaika.config.AppProperties). Money in INR.
app.brand-name=Zaika
app.zone=Asia/Kolkata
app.upload-dir=./uploads
app.seed-demo=false
app.platform-fee=5.00
app.gst-rate=0.05
app.free-delivery-threshold=499.00
app.rider-base-payout=30.00
