# MySQL 8 for demos and deployment. Every secret comes from environment variables (see .env.example).
# A .env file in the working directory is read too; real environment variables take precedence over it.
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Outgoing mail over SMTP
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
app.mail.from=${MAIL_FROM:Zaika <no-reply@zaika.test>}

# Public address of the site, used for links in emails such as password resets
app.base-url=${APP_BASE_URL:http://localhost:8080}

# First admin account, created on startup only while no admin exists; empty means none is created
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Demo data is off unless asked for
app.seed-demo=${SEED_DEMO:false}

# Signs remember-me cookies; empty means a random key per startup
app.remember-me-key=${REMEMBER_ME_KEY:}
